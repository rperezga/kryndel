name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # v4 lee la versión de "packageManager" en package.json (pnpm@11.5.2). Especificar
      # también "version:" aquí hacía fallar el CI (ERR_PNPM_BAD_PM_VERSION por doble versión).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
      # Ensure web package compiles for Vercel — vitest doesn't catch webpack/TS errors in Next.js
      - name: Build web (Vercel parity)
        run: pnpm --filter @kryndel/core build && pnpm --filter @kryndel/web build
        env:
          SKIP_ENV_VALIDATION: "1"
          # Placeholders so module-load guards (auth.ts builds a MongoClient eagerly in
          # production; NextAuth init) don't throw during `next build` page-data collection.
          # Real values are injected by Vercel at deploy; nothing here connects at build time.
          MONGODB_URI: "mongodb://127.0.0.1:27017/kryndel_ci_build"
          AUTH_SECRET: "ci_build_placeholder_secret_not_used_at_runtime"
