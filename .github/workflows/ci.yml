name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
      # Ensure web package compiles for Vercel — vitest doesn't catch webpack/TS errors in Next.js
      - name: Build web (Vercel parity)
        run: pnpm --filter @kryndel/core build && pnpm --filter @kryndel/web build
        env:
          SKIP_ENV_VALIDATION: "1"
